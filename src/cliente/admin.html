<!DOCTYPE html>
<html>
<head>
  <title>Admin - Monitor Apícola</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      color: #fff;
    }

    .subtitle {
      font-size: 12px;
      color: #4a5568;
      margin-bottom: 32px;
    }

    .status-box {
      background: #121a24;
      border: 1px solid #1f2a38;
      border-radius: 10px;
      padding: 24px 40px;
      font-size: 14px;
      margin-bottom: 28px;
      min-width: 280px;
      text-align: center;
    }

    .status-box span {
      color: #9aa4b2;
      font-size: 12px;
      display: block;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #conectado-display {
      font-size: 16px;
      font-weight: bold;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      background: #4a5568;
    }

    .dot.on  { background: #4ade80; box-shadow: 0 0 6px #4ade80aa; }
    .dot.off { background: #4a5568; }

    a {
      color: #4a5568;
      text-decoration: none;
      font-size: 13px;
      transition: 0.15s;
      margin-top: 8px;
    }

    a:hover { color: #9aa4b2; }
  </style>
</head>
<body>
  <h1>Painel Admin</h1>
  <p class="subtitle">Monitor Apícola</p>

  <div class="status-box">
    <span>Fonte de dados</span>
    <div id="conectado-display">
      <span class="dot" id="dot"></span>
      <span id="status-text">Verificando...</span>
    </div>
  </div>

  <a href="/">← Voltar ao monitor</a>

  <script>
    async function carregar() {
      try {
        const res = await fetch('/api/status');
        const d = await res.json();

        const dot  = document.getElementById('dot');
        const text = document.getElementById('status-text');

        if (d.conectado) {
          dot.className  = 'dot on';
          text.textContent = 'Conectada';
          text.style.color = '#4ade80';
        } else {
          dot.className  = 'dot off';
          text.textContent = 'Desconectada';
          text.style.color = '#4a5568';
        }
      } catch {
        document.getElementById('status-text').textContent = 'Servidor indisponível';
      }
    }

    carregar();
    setInterval(carregar, 3000);
  </script>
</body>
</html>
